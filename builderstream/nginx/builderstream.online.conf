# BuilderStream — nginx config for builderstream.online
# Place at: /etc/nginx/sites-available/builderstream.online
# Enable: ln -s /etc/nginx/sites-available/builderstream.online /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name builderstream.online www.builderstream.online;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name builderstream.online www.builderstream.online;

    # SSL — filled in by certbot
    # ssl_certificate /etc/letsencrypt/live/builderstream.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/builderstream.online/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React frontend (built static files)
    root /var/www/builderstream/builderstream/frontend/dist;
    index index.html;

    # Django static files (collectstatic output)
    location /static/ {
        alias /var/www/builderstream/builderstream/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # React Router — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
